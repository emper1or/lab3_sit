name: CI/CD

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Линтер (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка flake8
        run: python -m pip install --upgrade pip flake8==7.0.0

      - name: Проверка стиля (flake8)
        run: python -m flake8 .

  test:
    name: Тесты (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск тестов
        run: python -m pytest -v

  deploy:
    name: Деплой (self-hosted Debian)
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Пересборка и перезапуск контейнера
        run: |
          set -e
          docker stop mortgage-prod || true
          docker rm mortgage-prod || true
          docker build -t mortgage-fastapi:latest .
          docker run -d --name mortgage-prod -p 8000:8000 --restart always mortgage-fastapi:latest

      - name: Проверка состояния контейнера
        run: docker ps --filter "name=mortgage-prod"
